<script>

const coverPage = document.getElementById("coverPage");
const coverVideoPage = document.getElementById("coverVideoPage");
const coverVideo = document.getElementById("coverVideo");
const openInvitation = document.getElementById("openInvitation");

const contentPages = document.getElementById("contentPages");
const scene2Video = document.getElementById("scene2Video");
const scene2Page = document.getElementById("scene2Page");

const music = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");

const openRsvp = document.getElementById("openRsvp");
const closeRsvp = document.getElementById("closeRsvp");
const rsvpOverlay = document.getElementById("rsvpOverlay");
const sendRsvp = document.getElementById("sendRsvp");


/* =========================
   افتح هنا
========================= */

openInvitation.addEventListener("click", function () {

  // أولاً نظهر صفحة الفيديو
  coverVideoPage.style.display = "block";

  // نخفي الغلاف
  coverPage.style.display = "none";

  // نرجع لأول الفيديو
  coverVideo.currentTime = 0;

  // تشغيل الفيديو
  const playPromise = coverVideo.play();

  if (playPromise !== undefined) {
    playPromise
      .then(function () {
        console.log("Cover video playing");
      })
      .catch(function (error) {
        console.log("Video play error:", error);
      });
  }

  // تشغيل الموسيقى اختياري
  music.play()
    .then(function () {
      musicButton.style.display = "block";
      musicButton.textContent = "🔊";
    })
    .catch(function () {
      // عادي لو المتصفح منع الموسيقى
    });

});


/* =========================
   بعد انتهاء فيديو الكفر
========================= */

coverVideo.addEventListener("ended", function () {

  coverVideoPage.style.display = "none";

  contentPages.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "auto"
  });

});


/* =========================
   تشغيل الفيديو الثاني
========================= */

const sceneObserver = new IntersectionObserver(
  function(entries) {

    entries.forEach(function(entry) {

      if (
        entry.isIntersecting &&
        entry.intersectionRatio >= 0.5
      ) {

        scene2Video.play().catch(function () {});

      } else {

        scene2Video.pause();

      }

    });

  },
  {
    threshold: [0, 0.5, 1]
  }
);

sceneObserver.observe(scene2Page);


/* =========================
   MUSIC
========================= */

musicButton.addEventListener("click", function () {

  if (music.paused) {

    music.play();
    musicButton.textContent = "🔊";

  } else {

    music.pause();
    musicButton.textContent = "🔇";

  }

});


/* =========================
   RSVP
========================= */

openRsvp.addEventListener("click", function () {

  rsvpOverlay.classList.add("show");

  document.body.style.overflow = "hidden";

});


closeRsvp.addEventListener("click", closePopup);


rsvpOverlay.addEventListener("click", function(event) {

  if (event.target === rsvpOverlay) {
    closePopup();
  }

});


function closePopup() {

  rsvpOverlay.classList.remove("show");

  document.body.style.overflow = "";

}


/* =========================
   إرسال تأكيد الحضور
========================= */

sendRsvp.addEventListener("click", function () {

  const guestName =
    document
      .getElementById("guestName")
      .value
      .trim();

  const guestCount =
    document
      .getElementById("guestCount")
      .value;

  const attendance =
    document.querySelector(
      'input[name="attendance"]:checked'
    ).value;


  if (!guestName) {

    alert("اكتب الاسم أولاً 💗");

    return;

  }


  const whatsappNumber =
    "970599123456";


  const message =
`تأكيد حضور عيد ميلاد لينا 🎈

الاسم: ${guestName}
الحالة: ${attendance}
عدد الحضور: ${guestCount}

التاريخ: 7/7/2027
الوقت: 7:00 مساءً
المكان: قاعة إيليا - رام الله`;


  const whatsappURL =
    `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;


  window.open(
    whatsappURL,
    "_blank"
  );

});

</script>
