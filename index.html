<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
  >

  <title>Happy Birthday Lina</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    img,
    video {
      display: block;
      width: 100%;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .full-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* =========================
       COVER
    ========================= */

    #coverPage {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    #coverImage {
      width: 100%;
      height: auto;
      display: block;
    }

    #openInvitation {
      position: absolute;
      left: 50%;
      bottom: 6%;

      transform: translateX(-50%);

      z-index: 50;

      border: none;
      border-radius: 999px;

      padding: 14px 32px;

      background: linear-gradient(
        135deg,
        #f3a2bf,
        #ea6e99
      );

      color: #fff;

      font-size: 18px;
      font-weight: 700;

      box-shadow:
        0 8px 24px rgba(0,0,0,.18);

      cursor: pointer;
      white-space: nowrap;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #openInvitation:active {
      transform: translateX(-50%) scale(.97);
    }

    /* =========================
       COVER VIDEO
    ========================= */

    #coverVideoPage {
      display: none;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #000;
    }

    #coverVideo {
      width: 100%;
      height: auto;
      background: #000;
    }

    /* =========================
       CONTENT
    ========================= */

    #contentPages {
      display: none;
      width: 100%;
      background: #fff;
    }

    /* =========================
       TRANSPARENT HOTSPOTS
    ========================= */

    .transparent-hotspot {
      position: absolute;

      z-index: 999;

      display: block;

      margin: 0;
      padding: 0;

      border: none;
      outline: none;

      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* =========================
       LOCATION HOTSPOT
    ========================= */

    .location-hotspot {
      left: 50%;
      bottom: 6%;

      transform: translateX(-50%);

      width: 80%;
      height: 10%;
    }

    /* =========================
       SCENE 2
    ========================= */

    #scene2Page {
      position: relative;
      width: 100%;
      background: #000;
    }

    #scene2Video {
      width: 100%;
      height: auto;
      background: #000;
    }

    /* =========================
       RSVP HOTSPOT
    ========================= */

    .rsvp-hotspot {
      left: 14%;
      top: 19.5%;

      width: 72%;
      height: 14%;

      z-index: 999;
    }

    /* =========================
       SOCIAL MEDIA
    ========================= */

    .social-area {
      position: absolute;

      left: 50%;
      bottom: 3.5%;

      transform: translateX(-50%);

      width: 90%;

      z-index: 1000;

      text-align: center;
    }

    .social-title {
      margin-bottom: 10px;

      font-size: 13px;
      font-weight: 700;

      color: #765f73;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 12px;
    }

    .social-link {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(255,255,255,.92);

      border: 1px solid rgba(255,255,255,.9);

      box-shadow:
        0 4px 14px rgba(0,0,0,.12);

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .social-link svg {
      width: 23px;
      height: 23px;
    }

    .instagram-icon {
      fill: none;
      stroke: #d7628e;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tiktok-icon,
    .snapchat-icon {
      fill: #d7628e;
      stroke: none;
    }

    .social-link:active {
      transform: scale(.92);
    }

    /* =========================
       RSVP POPUP
    ========================= */

    #rsvpOverlay {
      position: fixed;
      inset: 0;

      z-index: 5000;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(60,45,64,.48);

      backdrop-filter: blur(6px);
    }

    #rsvpOverlay.show {
      display: flex;
    }

    .rsvp-card {
      position: relative;

      width: min(92vw, 430px);
      max-height: 90vh;

      overflow-y: auto;

      padding: 28px 22px 24px;

      border-radius: 26px;

      background:
        rgba(255,252,248,.99);

      box-shadow:
        0 15px 50px rgba(0,0,0,.20);

      text-align: center;
    }

    .rsvp-close {
      position: absolute;

      top: 12px;
      left: 14px;

      width: 38px;
      height: 38px;

      border: none;
      border-radius: 50%;

      background: #f4e7ec;

      color: #5d4959;

      font-size: 20px;

      cursor: pointer;
    }

    .rsvp-title {
      margin-bottom: 8px;

      font-size: 25px;

      color: #d85f8d;
    }

    .rsvp-subtitle {
      margin-bottom: 20px;

      font-size: 14px;
      line-height: 1.7;

      color: #765f73;
    }

    .field {
      margin-bottom: 14px;
      text-align: right;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 700;

      color: #654f64;
    }

    .field input,
    .field select {
      width: 100%;

      padding: 14px 15px;

      border: 1px solid #ead9e2;
      border-radius: 14px;

      background: #fff;

      color: #4f3e4d;

      font-size: 16px;

      outline: none;
    }

    .attendance-options {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-bottom: 18px;
    }

    .attendance-option input {
      display: none;
    }

    .attendance-option label {
      display: block;

      padding: 13px 10px;

      border: 1px solid #ead9e2;
      border-radius: 14px;

      background: #fff;

      color: #654f64;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    .attendance-option input:checked + label {
      background: #f6d5e1;
      border-color: #e38aaa;
      color: #bd5079;
    }

    .send-rsvp {
      width: 100%;

      padding: 15px;

      border: none;
      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #ef90b3,
          #e96897
        );

      color: #fff;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      .page,
      #coverPage,
      #coverVideoPage {
        max-width: 100%;
      }

      #openInvitation {
        font-size: 17px;
        padding: 13px 28px;
      }

      .social-link {
        width: 42px;
        height: 42px;
      }

      .social-link svg {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       01 COVER
  ========================= -->

  <section id="coverPage">

    <img
      id="coverImage"
      src="./cover.png"
      alt="Happy Birthday Lina"
    >

    <button
      id="openInvitation"
      type="button"
    >
      افتح هنا 🎈
    </button>

  </section>

  <!-- =========================
       02 COVER VIDEO
  ========================= -->

  <section
    id="coverVideoPage"
    class="page"
  >

    <video
      id="coverVideo"
      muted
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source
        src="./cover.mp4"
        type="video/mp4"
      >
    </video>

  </section>

  <!-- =========================
       CONTENT
  ========================= -->

  <main id="contentPages">

    <!-- =========================
         03 INFO
    ========================= -->

    <section
      id="infoPage"
      class="page"
    >

      <img
        src="./info.jpeg"
        class="full-image"
        alt="تفاصيل عيد ميلاد لينا"
      >

    </section>

    <!-- =========================
         04 LOCATION
    ========================= -->

    <section
      id="locationPage"
      class="page"
    >

      <img
        src="./location.jpeg"
        class="full-image"
        alt="قاعة إيليا رام الله"
      >

      <a
        class="transparent-hotspot location-hotspot"
        href="https://maps.app.goo.gl/Y6F9H54yMgRiaBzA9"
        target="_blank"
        rel="noopener"
        aria-label="فتح موقع قاعة إيليا"
      ></a>

    </section>

    <!-- =========================
         05 SECOND VIDEO
    ========================= -->

    <section
      id="scene2Page"
      class="page"
    >

      <video
        id="scene2Video"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
      >
        <source
          src="./scene2.mp4"
          type="video/mp4"
        >
      </video>

    </section>

    <!-- =========================
         06 FINAL
    ========================= -->

    <section
      id="finalPage"
      class="page"
    >

      <img
        src="./final.jpeg"
        class="full-image"
        alt="بانتظاركم في عيد ميلاد لينا"
      >

      <!-- زر تأكيد الحضور الشفاف -->

      <button
        id="openRsvp"
        class="transparent-hotspot rsvp-hotspot"
        type="button"
        aria-label="تأكيد الحضور"
        onclick="openRsvpPopup()"
      ></button>

      <!-- =========================
           SOCIAL MEDIA ICONS
      ========================= -->

      <div class="social-area">

        <div class="social-title">
          تواصلوا معنا
        </div>

        <div class="social-icons">

          <!-- Instagram -->
          <a
            class="social-link"
            href="https://www.instagram.com/ghada.invitations?igsi=dndkd3lhMmJ0M2E5&utm_source=qr"
            target="_blank"
            rel="noopener"
            aria-label="Instagram"
          >
            <svg
              class="instagram-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="5"
                ry="5"
              ></rect>

              <circle
                cx="12"
                cy="12"
                r="4"
              ></circle>

              <circle
                cx="17.5"
                cy="6.5"
                r="1"
              ></circle>
            </svg>
          </a>

          <!-- TikTok -->
          <a
            class="social-link"
            href="https://www.tiktok.com/@ghada.invitations?_r=1&_t=ZS-99Ru8uGvd10"
            target="_blank"
            rel="noopener"
            aria-label="TikTok"
          >
            <svg
              class="tiktok-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M14 4v9.2a3.7 3.7 0 1 1-2.5-3.5V7.2c-3.8-.5-6.5 2.3-6.5 5.7A6.5 6.5 0 0 0 18 13V9.9c1.2.9 2.5 1.4 4 1.4V7.8c-2.3 0-4.2-1.6-4.7-3.8H14z"
              ></path>
            </svg>
          </a>

          <!-- Snapchat -->
          <a
            class="social-link"
            href="https://snapchat.com/t/n8AEKXRm"
            target="_blank"
            rel="noopener"
            aria-label="Snapchat"
          >
            <svg
              class="snapchat-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 3.5c-2.4 0-4 1.8-4 4.3v1.3c-.5.1-1.2.4-1.2.9 0 .4.4.7 1.1.9-.2 1.3-1 2.4-2.3 3.2-.6.4-.4 1.2.3 1.4.7.2 1.3.5 1.8 1 .7.6 1.1 1.7 2.2 1.8.7.1 1.2-.2 2.1-.2s1.4.3 2.1.2c1.1-.1 1.5-1.2 2.2-1.8.5-.5 1.1-.8 1.8-1 .7-.2.9-1 .3-1.4-1.3-.8-2.1-1.9-2.3-3.2.7-.2 1.1-.5 1.1-.9 0-.5-.7-.8-1.2-.9V7.8c0-2.5-1.6-4.3-4-4.3z"
              ></path>
            </svg>
          </a>

        </div>

      </div>

    </section>

  </main>

  <!-- =========================
       RSVP POPUP
  ========================= -->

  <div id="rsvpOverlay">

    <div class="rsvp-card">

      <button
        id="closeRsvp"
        class="rsvp-close"
        type="button"
        aria-label="إغلاق"
      >
        ×
      </button>

      <h2 class="rsvp-title">
        تأكيد الحضور 🎈
      </h2>

      <p class="rsvp-subtitle">
        يسعدنا مشاركتكم فرحة عيد ميلاد لينا 💗
      </p>

      <div class="field">

        <label for="guestName">
          الاسم
        </label>

        <input
          id="guestName"
          type="text"
          placeholder="اكتب اسمك"
          autocomplete="name"
        >

      </div>

      <div class="field">

        <label for="guestCount">
          عدد الحضور
        </label>

        <select id="guestCount">

          <option value="1">
            شخص واحد
          </option>

          <option value="2">
            شخصان
          </option>

          <option value="3">
            3 أشخاص
          </option>

          <option value="4">
            4 أشخاص
          </option>

          <option value="5">
            5 أشخاص
          </option>

          <option value="6">
            6 أشخاص
          </option>

        </select>

      </div>

      <div class="attendance-options">

        <div class="attendance-option">

          <input
            type="radio"
            id="attendingYes"
            name="attendance"
            value="سأحضر"
            checked
          >

          <label for="attendingYes">
            🎉 سأحضر
          </label>

        </div>

        <div class="attendance-option">

          <input
            type="radio"
            id="attendingNo"
            name="attendance"
            value="أعتذر عن الحضور"
          >

          <label for="attendingNo">
            💗 أعتذر
          </label>

        </div>

      </div>

      <button
        id="sendRsvp"
        class="send-rsvp"
        type="button"
      >
        إرسال التأكيد
      </button>

    </div>

  </div>

  <script>

    const coverPage =
      document.getElementById("coverPage");

    const coverVideoPage =
      document.getElementById("coverVideoPage");

    const coverVideo =
      document.getElementById("coverVideo");

    const openInvitation =
      document.getElementById("openInvitation");

    const contentPages =
      document.getElementById("contentPages");

    const scene2Video =
      document.getElementById("scene2Video");

    const scene2Page =
      document.getElementById("scene2Page");

    const rsvpOverlay =
      document.getElementById("rsvpOverlay");

    const closeRsvp =
      document.getElementById("closeRsvp");

    const sendRsvp =
      document.getElementById("sendRsvp");


    /* =========================
       OPEN INVITATION
    ========================= */

    openInvitation.addEventListener(
      "click",
      function () {

        coverVideoPage.style.display =
          "block";

        coverPage.style.display =
          "none";

        window.scrollTo(0, 0);

        try {
          coverVideo.currentTime = 0;
        } catch (error) {}

        coverVideo
          .play()
          .catch(
            function(error) {
              console.log(
                "Cover video error:",
                error
              );
            }
          );

      }
    );


    /* =========================
       AFTER COVER VIDEO
    ========================= */

    coverVideo.addEventListener(
      "ended",
      function () {

        coverVideoPage.style.display =
          "none";

        contentPages.style.display =
          "block";

        window.scrollTo(0, 0);

        setTimeout(
          function () {
            playScene2IfVisible();
          },
          500
        );

      }
    );


    /* =========================
       SCENE 2 VIDEO
    ========================= */

    let scene2Started = false;


    function playScene2IfVisible() {

      if (scene2Started) {
        return;
      }

      const rect =
        scene2Video.getBoundingClientRect();

      const screenHeight =
        window.innerHeight;


      if (
        rect.top <
        screenHeight * 0.85
        &&
        rect.bottom >
        screenHeight * 0.15
      ) {

        scene2Started = true;

        try {
          scene2Video.currentTime = 0;
        } catch (error) {}

        scene2Video
          .play()
          .catch(
            function(error) {

              console.log(
                "Scene 2 autoplay blocked:",
                error
              );

              scene2Started = false;

            }
          );

      }

    }


    window.addEventListener(
      "scroll",
      playScene2IfVisible,
      {
        passive: true
      }
    );


    window.addEventListener(
      "resize",
      playScene2IfVisible
    );


    scene2Video.addEventListener(
      "click",
      function () {

        scene2Started = true;

        scene2Video
          .play()
          .catch(
            function() {}
          );

      }
    );


    /* =========================
       OPEN RSVP
    ========================= */

    function openRsvpPopup() {

      rsvpOverlay.classList.add(
        "show"
      );

      document.body.style.overflow =
        "hidden";

    }


    /* =========================
       CLOSE RSVP
    ========================= */

    function closePopup() {

      rsvpOverlay.classList.remove(
        "show"
      );

      document.body.style.overflow =
        "";

    }


    closeRsvp.addEventListener(
      "click",
      closePopup
    );


    rsvpOverlay.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          rsvpOverlay
        ) {

          closePopup();

        }

      }
    );


    /* =========================
       SEND RSVP
    ========================= */

    sendRsvp.addEventListener(
      "click",
      function () {

        const guestName =
          document
            .getElementById("guestName")
            .value
            .trim();

        const guestCount =
          document
            .getElementById("guestCount")
            .value;

        const attendance =
          document
            .querySelector(
              'input[name="attendance"]:checked'
            )
            .value;


        if (!guestName) {

          alert(
            "اكتب الاسم أولاً 💗"
          );

          return;

        }


        const whatsappNumber =
          "970599123456";


        const message =
`تأكيد حضور عيد ميلاد لينا 🎈

الاسم: ${guestName}
الحالة: ${attendance}
عدد الحضور: ${guestCount}

التاريخ: 7/7/2027
الوقت: 7:00 مساءً
المكان: قاعة إيليا - رام الله`;


        const whatsappURL =
          `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;


        window.location.href =
          whatsappURL;

      }
    );

  </script>

</body>
</html>
